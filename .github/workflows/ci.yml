name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/relaykit/go.sum
            backend/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p backend/web/dist
          touch backend/web/dist/index.html

      - name: Vet root module
        working-directory: backend
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: backend/relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: backend/tokenkit
        run: go vet ./...

      - name: Build root module
        working-directory: backend
        run: go build ./...

      - name: Build relaykit independently
        working-directory: backend/relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: backend/tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
