# Nginx for the split deployment: serves the built console and proxies the
# gateway's API/relay prefixes to the api service. Cookies stay same-origin, so
# the refresh cookie and the Secure/OriginGuard settings behave as in the
# single-binary deployment.
#
# Two Docker-specific problems are handled here:
#   1. A literal `proxy_pass http://api:3000` resolves the name once at startup
#      and keeps that IP forever, so every request 502s after `api` is rebuilt.
#      Resolving through Docker's embedded DNS per request (set + variable
#      proxy_pass + resolver) fixes that.
#   2. The gateway runs AutoMigrate on every start and only listens afterwards
#      (~10s on a cold database). Requests arriving in that window would 502.
#      They are held briefly and retried instead, so a restart is invisible to
#      the browser.

# WebSocket upgrade for /v1/realtime and /v1/responses. This file is included
# from the http context, so map must stay outside the server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    root /usr/share/nginx/html;
    index index.html;

    # Relay requests can carry base64 images and multipart audio.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 5s;

    # While the gateway is starting, hold the request until it starts listening
    # rather than failing immediately. 502/504 are turned into a short wait and
    # one more attempt by the error_page handlers below.
    proxy_intercept_errors off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        error_page 502 504 = @retry_api;
    }

    location /v1/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived streams: do not retry mid-session.
        error_page 502 504 = @gateway_starting;
    }

    location /v1beta/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        error_page 502 504 = @retry_api;
    }

    location /mj/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        error_page 502 504 = @retry_api;
    }

    location /pg/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        error_page 502 504 = @retry_api;
    }

    # Retry once after a short pause. This alone cannot cover a 10s migration,
    # so the console also retries on its side; together they hide a restart.
    location @retry_api {
        internal;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
    }

    # Streams: report a retryable status instead of a hard 502.
    location @gateway_starting {
        internal;
        default_type application/json;
        return 503 '{"error":{"message":"gateway is starting, please retry","type":"service_unavailable"}}';
    }

    # Hashed build assets are immutable.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
