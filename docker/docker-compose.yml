name: nexusai

services:
  api:
    # Gateway-only image: the console is served by the web service below.
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        GOPROXY: ${GOPROXY_BUILD:-https://proxy.golang.org,direct}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR_BUILD:-}
    image: nexusai:latest
    container_name: nexusai-api
    restart: always
    command: --log-dir /app/logs
    # Every variable in docker/.env is passed to the process, so the whole
    # documented settings file takes effect instead of only the entries listed
    # under environment below. The file is optional; copy .env.example first.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/api/data:/data
      - ./data/api/logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@pgsql:5432/new-api
#      - SQL_DSN=root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@pgsql:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in docker/.env}@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379
      # TZ, ERROR_LOG_ENABLED, BATCH_UPDATE_ENABLED, NODE_NAME and
      # USER_SESSION_REVOKED_RETENTION_DAYS are set in the env file above, so
      # they can be changed without editing this file. Only values that must
      # reference another service (SQL_DSN, REDIS_CONN_STRING) or that the
      # gateway itself must not treat as client input (TRUSTED_PROXIES) stay
      # here; anything listed here overrides the env file.
      #
      # The browser talks to the web service, which forwards X-Forwarded-For.
      # Keep the API port private and trust only the Compose bridge network.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      # INITIAL_ROOT_USERNAME / INITIAL_ROOT_PASSWORD are not listed here on
      # purpose: env_file already passes them. Repeating them as ${VAR} would
      # override the file with an empty string whenever the variable is not in
      # the shell that runs docker compose.
#      - DEFAULT_LANGUAGE=zh-CN  # 默认语言：日志输出，以及对方没有指定语言时返回的提示、邮件和通知；可选 en、zh-CN、zh-TW，不设置为 en (Default language of logs and of messages, emails and notifications when the reader states none: en, zh-CN or zh-TW; en if unset)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      redis:
        condition: service_started
      pgsql:
        condition: service_healthy
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - nexusai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    # Console-only image: Nginx serves the build and proxies the API prefixes.
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        BUN_IMAGE: ${BUN_IMAGE_BUILD:-oven/bun:1.4.0}
        NGINX_IMAGE: ${NGINX_IMAGE_BUILD:-nginx:alpine}
    image: nexusai-web:local
    container_name: nexusai-web
    restart: always
    ports:
      - "8098:80"
    depends_on:
      api:
        # Wait for the gateway's own health check, so the console is not
        # published while AutoMigrate still runs and every request would 502.
        condition: service_healthy
    networks:
      - nexusai-network

  pgsql:
    image: postgres:16
    container_name: nexusai-pgsql
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: new-api
    volumes:
      - ./data/pgsql_data:/var/lib/postgresql/data
    networks:
      - nexusai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

  redis:
    image: redis:7
    container_name: nexusai-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}"]
    volumes:
      - ./data/redis_data:/data
    networks:
      - nexusai-network



#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in docker/.env}
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - new-api-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above


networks:
  nexusai-network:
    driver: bridge
